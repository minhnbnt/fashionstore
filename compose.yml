services:
  postgres:
    image: ghcr.io/minhnbnt/postgresql:latest

    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql:/docker-entrypoint-initdb.d/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotrue:
    image: ghcr.io/supabase/gotrue:v2.197.0

    env_file:
      - ./config/gotrue.env

    ports:
      - "9999:9999"

    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1

    ports:
      - 8025:8025

    volumes:
      - mailpit_data:/data

    environment:
      MP_DATABASE: /data/mailpit.db
      MAIL_FROM_ADDRESS: no-reply@test.local
      MAIL_FROM_NAME: My App

  s3:
    image: ghcr.io/minhnbnt/versitygw:latest

    ports:
      - "9000:9000"

    volumes:
      - versitygw_data:/data

    environment:
      ROOT_ACCESS_KEY: fashionstore
      ROOT_SECRET_KEY: passwordpassword

      VGW_PORT: ":9000"
      VGW_ARGS: --health /health
      VGW_BACKEND_ARGS: /data/s3
      VGW_BACKEND: posix
      VGW_CORS_ALLOW_ORIGIN: "*"
      VGW_WEBUI_ADMIN_GATEWAYS: http://localhost:7071

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mailpit_data:
  postgres_data:
  versitygw_data:
