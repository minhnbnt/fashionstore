services:
  postgres:
    image: ghcr.io/minhnbnt/postgresql:latest

    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/postgresql:/docker-entrypoint-initdb.d/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotrue:
    image: ghcr.io/supabase/gotrue:v2.197.0

    env_file:
      - ./config/gotrue.env
      - path: .env
        required: false

    environment:
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}

    ports:
      - "9999:9999"

    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1

    ports:
      - 8025:8025

    volumes:
      - mailpit_data:/data

    environment:
      MP_DATABASE: /data/mailpit.db
      MAIL_FROM_ADDRESS: no-reply@test.local
      MAIL_FROM_NAME: My App

  s3:
    image: ghcr.io/minhnbnt/versitygw:latest

    ports:
      - "9000:9000"

    volumes:
      - versitygw_data:/data

    environment:
      ROOT_ACCESS_KEY: fashionstore
      ROOT_SECRET_KEY: passwordpassword

      VGW_PORT: ":9000"
      VGW_ARGS: --health /health
      VGW_BACKEND_ARGS: /data/s3
      VGW_BACKEND: posix
      VGW_CORS_ALLOW_ORIGIN: "*"
      VGW_WEBUI_ADMIN_GATEWAYS: http://localhost:7071

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  embed-worker:
    image: ghcr.io/minhnbnt/fashionstore-embed-worker:latest

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fashionstore
      S3_ENDPOINT_URL: http://s3:9000
      GRPC_BIND_HOST: 0.0.0.0

    ports:
      - "9091:9091"

    healthcheck:
      test: ["CMD", "node", "dist/grpc-health.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

  ai-backend:
    image: ghcr.io/minhnbnt/fashionstore-ai-backend:latest

    environment:
      GOTRUE_URL: http://gotrue:9999
      GOTRUE_JWT_AUD: authenticated
      AI_BASE_URL: https://api.kilo.ai/api/gateway/v1
      AI_API_KEY: ${AI_API_KEY:-xxx}
      AI_MODEL: ${AI_MODEL:-}
      STORE_API_URL: http://host.docker.internal:8080
      CORS_ORIGIN: "*"
      S3_ENDPOINT_URL: http://s3:9000
      S3_BUCKET: fashionstore
      S3_ACCESS_KEY: fashionstore
      S3_SECRET_KEY: passwordpassword
      S3_REGION: us-east-1
      ASSETS_URL: http://fashionstore.web.localhost:3902

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    depends_on:
      gotrue:
        condition: service_started
      s3:
        condition: service_healthy

  caddy:
    image: quay.io/hummingbird/caddy:2

    ports:
      - "8081:8080"

    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro,Z

    environment:
      OPENAI_URL: https://api.kilo.ai
      OPENAI_BASE_PATH: /api/gateway
      OPENAI_TOKEN: xxx

volumes:
  mailpit_data:
  postgres_data:
  versitygw_data:
