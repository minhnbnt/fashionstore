services:
  postgres:
    image: ghcr.io/minhnbnt/postgresql:latest
    # The image bakes in USER postgres, but the entrypoint must start as root
    # to take ownership of the data volume before dropping privileges.
    user: "0:0"

    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql:/docker-entrypoint-initdb.d/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: registry.access.redhat.com/hi/pgbouncer:1.25

    ports:
      - "6432:6432"

    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    depends_on:
      postgres:
        condition: service_healthy

  gotrue:
    image: ghcr.io/supabase/gotrue:v2.197.0

    env_file:
      - ./config/gotrue.env
      - path: ./.env
        required: false

    ports:
      - "9999:9999"

    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1

    ports:
      - 8025:8025

    volumes:
      - mailpit_data:/data

    environment:
      MP_DATABASE: /data/mailpit.db
      MAIL_FROM_ADDRESS: no-reply@test.local
      MAIL_FROM_NAME: My App

  garage:
    image: ghcr.io/minhnbnt/garage:latest
    command: ["server", "--single-node", "--default-bucket"]
    ports:
      - "3900:3900"
      - "3902:3902"
      - "3903:3903"

    volumes:
      - garage_data:/var/lib/garage
      - ./config/garage.toml:/etc/garage.toml:ro

    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GKd44959a54214a28492750765e375479f
      GARAGE_DEFAULT_SECRET_KEY: passwordpassword
      GARAGE_DEFAULT_BUCKET: fashionstore

    healthcheck:
      test: ["CMD", "/usr/bin/garage", "health", "-q"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  garage_data:
  mailpit_data:
  postgres_data:
