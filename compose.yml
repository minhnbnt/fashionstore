services:
  postgres:
    image: ghcr.io/minhnbnt/postgresql:latest

    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql:/docker-entrypoint-initdb.d/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: registry.access.redhat.com/hi/pgbouncer:1.25

    ports:
      - "6432:6432"

    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    depends_on:
      postgres:
        condition: service_healthy

  gotrue:
    image: ghcr.io/supabase/gotrue:v2.197.0

    env_file:
      - ./config/gotrue.env

    ports:
      - "9999:9999"

    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1

    ports:
      - 8025:8025

    volumes:
      - mailpit_data:/data

    environment:
      MP_DATABASE: /data/mailpit.db
      MAIL_FROM_ADDRESS: no-reply@test.local
      MAIL_FROM_NAME: My App

  s3:
    image: ghcr.io/versity/versitygw:v1.9.0

    environment:
      ROOT_ACCESS_KEY: versityadmin
      ROOT_SECRET_KEY: versityadmin
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/s3
      VGW_PORT: ":3900"
      VGW_HEALTH: /health
      VGW_CORS_ALLOW_ORIGIN: "*"

    ports:
      - "3900:3900"

    volumes:
      - s3_data:/data/s3

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3900/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  s3-init:
    image: amazon/aws-cli:latest

    depends_on:
      - s3

    entrypoint: ["sh", "/versitygw-init.sh"]

    environment:
      AWS_ACCESS_KEY_ID: versityadmin
      AWS_SECRET_ACCESS_KEY: versityadmin
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://s3:3900
      S3_BUCKET: fashionstore

    volumes:
      - ./config/versitygw-init.sh:/versitygw-init.sh:ro

volumes:
  s3_data:
  mailpit_data:
  postgres_data:
