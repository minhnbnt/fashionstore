spring:
  aot:
    enabled: false

  docker:
    compose:
      enabled: false

  datasource:
    connection-fetch: lazy
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fashionstore}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  flyway:
    out-of-order: true

  main:
    banner-mode: off
    lazy-initialization: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISS_URI:http://localhost:9999}

server:
  port: ${SERVER_PORT:8080}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  bucket: fashionstore
  access-key: ${S3_ACCESS_KEY:fashionstore}
  secret-key: ${S3_SECRET_KEY:passwordpassword}
  public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}

gotrue:
  url: http://localhost:9999
  # DEV ONLY: JWT role=service_role ký bằng khóa ES256 dev (d=1, công khai) trong config/gotrue.env, hạn 10 năm.
  # Staging/production: tạo key riêng từ khóa thật, truyền qua GOTRUE_SERVICE_ROLE_KEY.
  service-role-key: ${GOTRUE_SERVICE_ROLE_KEY:eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImQ4NzVkYjdkZWYyMzIyMzYifQ.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0Ojk5OTkiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzkyMjgxNjAwLCJleHAiOjIxMDc2NDE2MDB9.z0DAYl8eP7yk9WvmzjKQoOqHbTeHamqBvkoYrJ4rTKCRUByTy4nZwe8JF5q3_0EQ9yHQ4DnUuLY3RVYHoCsuEw}

app:
  demo-seed: true

  # Tài khoản admin tạo sẵn lúc khởi động (idempotent). Đổi mật khẩu qua ADMIN_PASSWORD.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@fashionstore.local}
    password: ${ADMIN_PASSWORD:Admin@123456}
    display-name: Admin
