spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/fashionstore
    username: postgres
    password: postgres

  flyway:
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  bucket: fashionstore
  access-key: fashionstore
  secret-key: passwordpassword
  public-base-url: http://localhost:9000

gotrue:
  url: http://localhost:9999
  service-role-key: ""
