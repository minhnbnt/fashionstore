spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:6432/fashionstore}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISS_URI:http://localhost:9999}

server:
  port: ${SERVER_PORT:8081}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:3900}
  region: ${S3_REGION:garage}
  bucket: ${S3_BUCKET:fashionstore}
  access-key: ${S3_ACCESS_KEY:GKd44959a54214a28492750765e375479f}
  secret-key: ${S3_SECRET_KEY:passwordpassword}
  # Base URL public (Garage website endpoint). Không có trailing slash.
  # Browser cần resolve được host này:
  #   echo '127.0.0.1 fashionstore.web.garage.localhost' >> /etc/hosts
  public-base-url: ${S3_PUBLIC_BASE_URL:http://fashionstore.web.garage.localhost:3902}